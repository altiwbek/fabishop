name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: RSpec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yourname
          POSTGRES_PASSWORD: yourpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      # Matches the ENV.fetch keys in config/database.yml
      FABISHOP_DATABASE_HOST: localhost
      FABISHOP_DATABASE_USERNAME: yourname
      FABISHOP_DATABASE_PASSWORD: yourpassword

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads the version from .ruby-version
          bundler-cache: true

      - name: Build Tailwind CSS (rendered by request specs)
        run: bin/rails tailwindcss:build

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec
